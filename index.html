<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NordVPN Server Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-30 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-lg bg-blue-600 flex items-center justify-center font-bold text-xl shadow">N</div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">NordVPN Servers</h1>
                    <p class="text-xs text-slate-400">Live Explorer & Real-Time Browser Ping</p>
                </div>
            </div>
            <div id="statsContainer" class="flex items-center space-x-6 text-sm text-slate-300">
                <div>Total: <span id="statTotal" class="font-semibold text-white">--</span></div>
                <div>Online: <span id="statOnline" class="font-semibold text-emerald-400">--</span></div>
                <div>Avg Load: <span id="statAvgLoad" class="font-semibold text-blue-400">--</span></div>
            </div>
        </div>
    </header>

    <!-- Main -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
        <!-- Controls -->
        <div class="bg-slate-800 rounded-xl p-4 sm:p-6 mb-6 border border-slate-700 shadow-sm space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
                <div>
                    <label for="searchInput" class="block text-xs font-medium text-slate-400 mb-1">Search</label>
                    <input type="text" id="searchInput" placeholder="Name, IP, Hostname..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label for="countryFilter" class="block text-xs font-medium text-slate-400 mb-1">Country</label>
                    <select id="countryFilter" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="">All Countries</option>
                    </select>
                </div>
                <div>
                    <label for="statusFilter" class="block text-xs font-medium text-slate-400 mb-1">Status</label>
                    <select id="statusFilter" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="">All Statuses</option>
                        <option value="online">Online</option>
                        <option value="offline">Offline</option>
                    </select>
                </div>
                <div>
                    <label for="sortBy" class="block text-xs font-medium text-slate-400 mb-1">Sort By</label>
                    <select id="sortBy" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="ping_asc">Ping (Fastest First)</option>
                        <option value="load_asc">Load (Lowest First)</option>
                        <option value="name_asc">Name (A-Z)</option>
                        <option value="load_desc">Load (Highest First)</option>
                    </select>
                </div>
                <div class="flex items-end">
                    <button id="btnPingVisible" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium text-sm py-2 px-3 rounded-lg transition">
                        Ping Visible Page
                    </button>
                </div>
            </div>
        </div>

        <!-- Status Views -->
        <div id="loadingState" class="flex flex-col items-center justify-center py-20">
            <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
            <p class="text-slate-400 text-sm">Fetching server list from NordVPN API...</p>
        </div>

        <div id="errorState" class="hidden bg-red-900/30 border border-red-500/50 rounded-xl p-6 text-center max-w-lg mx-auto my-12">
            <h3 class="text-lg font-semibold text-red-400 mb-2">Failed to load server data</h3>
            <p id="errorMessage" class="text-sm text-slate-300 mb-4">An error occurred.</p>
            <button id="btnRetry" class="bg-red-600 hover:bg-red-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition">Retry</button>
        </div>

        <div id="serverContainer" class="hidden">
            <div id="serverGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            <div id="emptyState" class="hidden py-16 text-center text-slate-400">
                <p class="text-lg font-medium">No servers match your criteria.</p>
            </div>
            <div class="mt-8 flex flex-col sm:flex-row items-center justify-between gap-4 border-t border-slate-800 pt-6">
                <div class="text-sm text-slate-400">
                    Showing <span id="pageStart" class="font-semibold text-slate-200">0</span> - 
                    <span id="pageEnd" class="font-semibold text-slate-200">0</span> of 
                    <span id="totalFiltered" class="font-semibold text-slate-200">0</span> servers
                </div>
                <div class="flex items-center space-x-2">
                    <button id="btnPrev" class="px-3 py-1.5 bg-slate-800 border border-slate-700 hover:bg-slate-700 disabled:opacity-50 text-sm rounded-lg">Previous</button>
                    <span id="pageIndicator" class="text-sm text-slate-400 px-2">Page 1</span>
                    <button id="btnNext" class="px-3 py-1.5 bg-slate-800 border border-slate-700 hover:bg-slate-700 disabled:opacity-50 text-sm rounded-lg">Next</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal -->
    <div id="modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-2xl w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-700 flex items-center justify-between">
                <h3 id="modalTitle" class="text-lg font-bold text-white">Server Details</h3>
                <button id="btnCloseModal" class="text-slate-400 hover:text-white p-1 rounded-lg">✕</button>
            </div>
            <div id="modalContent" class="p-6 overflow-y-auto space-y-6 text-sm text-slate-300"></div>
        </div>
    </div>

    <!-- External Script Load -->
    <script src="app.js"></script>
</body>
</html>
